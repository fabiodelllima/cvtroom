stages:
  - lint
  - test
  - security
  - build

default:
  image: golang:1.26

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: -mod=readonly

cache:
  key: go-modules
  paths:
    - .go/pkg/mod/

format:
  stage: lint
  script:
    - unformatted="$(gofmt -l $(git ls-files '*.go'))"
    - if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

vet:
  stage: lint
  script:
    - go vet ./...

test:
  stage: test
  script:
    - go test -race -covermode=atomic -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out

govulncheck:
  stage: security
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

build:
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X gitlab.com/delimafabio/cvtroom/internal/cli.Version=${VERSION}" -o bin/cvtr ./cmd/cvtr
  artifacts:
    paths:
      - bin/cvtr
